[phases.setup]
nixPkgs = ["php83", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.dom", "php83Extensions.fileinfo", "php83Extensions.filter", "php83Extensions.gd", "php83Extensions.hash", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.session", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.zip", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs", "npm ci --no-audit --prefer-offline"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
